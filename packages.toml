# Package sources for the nightly build.
#
# Every entry produces an installer package: a few kilobytes of maintainer
# script that downloads the payload from the publisher and checks it against a
# SHA-256 pinned at build time. Nothing upstream is redistributed.
#
# install = "deb"     download a .deb and unpack it into /
# install = "member"  download an archive and place one executable in /usr/bin
# install = "tree"    download an archive and place the application in /opt
#
# The version comes from the publisher: a GitHub release tag with a leading "v"
# stripped, a version_re applied to a JSON feed, or a version_re applied to the
# path a plain URL redirects to.

[act]
install = "member"
repo = "nektos/act"
asset = '^act_Linux_x86_64\.tar\.gz$'
member = "act"
description = "Run GitHub Actions locally"
homepage = "https://github.com/nektos/act"
license = "MIT"

[lazygit]
install = "member"
repo = "jesseduffield/lazygit"
asset = '^lazygit_[0-9.]+_linux_x86_64\.tar\.gz$'
member = "lazygit"
description = "Terminal UI for git commands"
homepage = "https://github.com/jesseduffield/lazygit"
license = "MIT"

[stylua]
install = "member"
repo = "JohnnyMorganz/StyLua"
asset = '^stylua-linux-x86_64\.zip$'
member = "stylua"
description = "Opinionated Lua code formatter"
homepage = "https://github.com/JohnnyMorganz/StyLua"
license = "MPL-2.0"

[galaxybudsclient]
install = "member"
repo = "timschneeb/GalaxyBudsClient"
asset = '^GalaxyBudsClient_linux-amd64_portable\.zip$'
member = "GalaxyBudsClient"
description = "Unofficial manager for Samsung Galaxy Buds"
homepage = "https://github.com/timschneeb/GalaxyBudsClient"
license = "GPL-3.0"
depends = "libc6, libstdc++6, libgcc-s1, libx11-6, libfontconfig1, bluez"
desktop_name = "Galaxy Buds Client"
desktop_categories = "Audio;AudioVideo;Settings;"
icon = "audio-headset"

# Replaces deb-free.griffo.io, which holds every release for two months. The
# .deb fetched here is the same file deb.griffo.io serves behind its paywall.
[ghostty]
install = "deb"
repo = "dariogriffo/ghostty-debian"
asset = '^ghostty_[0-9.]+-[0-9]+\.forky_amd64\.deb$'
description = "GPU-accelerated terminal emulator"
homepage = "https://ghostty.org"
license = "MIT"

# Replaces palfrey.github.io/discord-apt with Discord's own build.
[discord]
install = "deb"
url = "https://discord.com/api/download?platform=linux&format=deb"
version_re = 'discord-([0-9.]+)\.deb'
description = "Voice and text chat client"
homepage = "https://discord.com"
license = "Proprietary, Discord Terms of Service"

# Replaces mirror.mwt.me with Zoom's own build.
[zoom]
install = "deb"
url = "https://zoom.us/client/latest/zoom_amd64.deb"
version_re = 'prod/([0-9.]+)/zoom_amd64\.deb'
description = "Video conferencing client"
homepage = "https://zoom.us"
license = "Proprietary, Zoom Terms of Service"

# Replaces the unofficial jetbrains-ppa S3 bucket, which serves an IDE over
# plain HTTP. The tarball comes from JetBrains' own release feed, which also
# publishes the SHA-256 that the postinst checks.
[clion]
install = "tree"
json = "https://data.services.jetbrains.com/products/releases?code=CL&latest=true&type=release"
json_path = "CL.0.downloads.linux"
version_re = 'CLion-([0-9.]+)\.tar\.gz'
launcher = ["bin/clion", "bin/clion.sh"]
icon = "bin/clion.svg"
description = "JetBrains C and C++ IDE"
homepage = "https://www.jetbrains.com/clion/"
license = "Proprietary, JetBrains Toolbox Subscription Agreement"
section = "devel"
depends = "libc6, libxext6, libxrender1, libxtst6, libxi6, libfreetype6, libfontconfig1"
desktop_name = "CLion"
desktop_categories = "Development;IDE;"
wm_class = "jetbrains-clion"

# Replaces the hand-unpacked tree in ~/.local/zed.app, which only zed's own
# updater could refresh, and the 1.8.2 that deb-free.griffo.io still serves.
[zed]
install = "tree"
repo = "zed-industries/zed"
asset = '^zed-linux-x86_64\.tar\.gz$'
launcher = ["bin/zed"]
icon = "share/icons/hicolor/512x512/apps/zed.png"
description = "Multiplayer code editor"
homepage = "https://zed.dev"
license = "GPL-3.0 and Apache-2.0"
section = "editors"
depends = "libc6, libasound2t64, libfontconfig1, libwayland-client0, libxkbcommon0"
desktop_name = "Zed"
desktop_categories = "Development;IDE;TextEditor;"
wm_class = "dev.zed.Zed"

# Replaces `cargo install watchexec-cli`, which has no update path. Upstream
# ships a real .deb, so its own control metadata is kept.
[watchexec]
install = "deb"
repo = "watchexec/watchexec"
asset = '^watchexec-[0-9.]+-x86_64-unknown-linux-gnu\.deb$'
description = "Run commands when files change"
homepage = "https://watchexec.github.io"
license = "Apache-2.0"

# Replaces `cargo install difftastic`. The binary is named difft, not the
# package name, so the launcher is placed under its own name.
[difftastic]
install = "member"
repo = "Wilfred/difftastic"
asset = '^difft-x86_64-unknown-linux-gnu\.tar\.gz$'
member = "difft"
binary = "difft"
description = "Structural diff that understands syntax"
homepage = "https://difftastic.wilfred.me.uk"
license = "MIT"

# Replaces the hand-unpacked tree in ~/.local/share/lua-language-server. The
# tarball has no wrapping directory, so nothing is stripped.
[lua-language-server]
install = "tree"
repo = "LuaLS/lua-language-server"
asset = '^lua-language-server-[0-9.]+-linux-x64\.tar\.gz$'
strip = 0
launcher = ["bin/lua-language-server"]
description = "Language server for Lua"
homepage = "https://luals.github.io"
license = "MIT"
section = "devel"

[gcc-17]
install = "tree"
repo = "DiamonDinoia/apt"
tag = "mirror"
# The major is pinned here on purpose. The day trunk becomes 18 no asset
# matches and the build stops with the new name in the error, which is the
# signal to add a [gcc-18] block and retire this one.
asset = '^gcc-17-trunk[0-9]{8}\.tar\.xz$'
version_re = 'gcc-(17)-(trunk[0-9]{8})\.tar\.xz'
defer_to_debian = true
# A compiler without the C library headers cannot compile anything, and
# Debian's own gcc-NN depends on libc6-dev for the same reason. libxml2 is what
# the nine libgcobol objects link against, so gcobol-17 cannot link without it;
# Debian's libgcobol1 carries the same dependency.
depends = "libc6, libc6-dev, libxml2"
strip = 2
launcher = ["bin/gcc"]
section = "devel"
homepage = "https://gcc.gnu.org"
description = "GCC 17 pre-release, built nightly by Compiler Explorer, mirrored here"
license = "GPL-3.0-or-later with GCC Runtime Library Exception"

# Debian's own naming, so a script written for gcc-17 keeps working after the
# distribution takes the name over. `go` and `gofmt` are deliberately absent:
# they are Go programs linked against the payload's libgo, so they exit 127
# outside a loader path this package does not set. The bundled binutils are
# absent too, because the driver finds them itself and Debian's gcc-NN does not
# put them in PATH either.
[gcc-17.links]
"g++-17" = "bin/g++"
"cpp-17" = "bin/cpp"
"gfortran-17" = "bin/gfortran"
"gcc-ar-17" = "bin/gcc-ar"
"gcc-nm-17" = "bin/gcc-nm"
"gcc-ranlib-17" = "bin/gcc-ranlib"
"gcov-17" = "bin/gcov"
"gcov-dump-17" = "bin/gcov-dump"
"gcov-tool-17" = "bin/gcov-tool"
"lto-dump-17" = "bin/lto-dump"
"gccgo-17" = "bin/gccgo"
"gdc-17" = "bin/gdc"
"gm2-17" = "bin/gm2"
"gccrs-17" = "bin/gccrs"
"ga68-17" = "bin/ga68"
"gcobol-17" = "bin/gcobol"
"gcobc-17" = "bin/gcobc"
"gnat-17" = "bin/gnat"
"gnatbind-17" = "bin/gnatbind"
"gnatchop-17" = "bin/gnatchop"
"gnatclean-17" = "bin/gnatclean"
"gnatkr-17" = "bin/gnatkr"
"gnatlink-17" = "bin/gnatlink"
"gnatls-17" = "bin/gnatls"
"gnatmake-17" = "bin/gnatmake"
"gnatname-17" = "bin/gnatname"
"gnatprep-17" = "bin/gnatprep"

# Third-party apt sources this repository sets up, so a fresh machine needs one
# install rather than ten hand-written files. Each key is fetched at build time
# and checked against the sha256 below, so a rotated key stops the build with
# the new hash instead of shipping whatever the URL happened to serve. The
# fields are the deb822 ones and go into the .sources verbatim.
#
# `separate` puts a repository in its own diamondinoia-repo-<name> package.
# Only the two that are specific to one machine's hardware are separate; the
# rest ride in the bootstrap, because a machine that wants this repository at
# all wants a current llvm and gh.

[repos.brave]
uris = "https://brave-browser-apt-release.s3.brave.com/"
suites = "stable"
components = "main"
key = "https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg"
key_sha256 = "c85e85aa3d1783ffaa649ee8dbbc22af7f87192d304602d37e3018226b394788"

[repos.github-cli]
uris = "https://cli.github.com/packages/"
suites = "stable"
components = "main"
key = "https://cli.github.com/packages/githubcli-archive-keyring.gpg"
key_sha256 = "6084d5d7bd8e288441e0e94fc6275570895da18e6751f70f057485dc2d1a811b"

[repos.google-cloud-cli]
uris = "https://packages.cloud.google.com/apt"
suites = "cloud-sdk"
components = "main"
architectures = "amd64"
key = "https://packages.cloud.google.com/apt/doc/apt-key.gpg"
key_sha256 = "3ecc63922b7795eb23fdc449ff9396f9114cb3cf186d6f5b53ad4cc3ebfbb11f"

# One stanza, not five: deb822 Suites takes a list, and the five llvm-toolchain
# suites differ in nothing else.
[repos.llvm]
uris = "https://apt.llvm.org/unstable/"
suites = "llvm-toolchain llvm-toolchain-19 llvm-toolchain-20 llvm-toolchain-21 llvm-toolchain-22"
components = "main"
architectures = "amd64 arm64"
key = "https://apt.llvm.org/llvm-snapshot.gpg.key"
key_sha256 = "8b2a587ffd672c4687e7581dad4b2f6c1bb2ad6b480cd9771ba2ff48e0b8c75d"

# Stable and experimental share a key and a suite, so URIs takes both.
[repos.nvidia-container-toolkit]
uris = "https://nvidia.github.io/libnvidia-container/stable/deb/amd64/ https://nvidia.github.io/libnvidia-container/experimental/deb/amd64/"
suites = "/"
key = "https://nvidia.github.io/libnvidia-container/gpgkey"
key_sha256 = "c880576d6cf75a48e5027a871bac70fd0421ab07d2b55f30877b21f1c87959c9"

[repos.onlyoffice]
uris = "https://download.onlyoffice.com/repo/debian/"
suites = "squeeze"
components = "main"
key = "https://download.onlyoffice.com/GPG-KEY-ONLYOFFICE"
key_sha256 = "35470c0db19bed875fff786a2d65a62cdb056459a2b3e12fd846be96178388e4"

[repos.tailscale]
uris = "https://pkgs.tailscale.com/stable/debian/"
suites = "sid"
components = "main"
key = "https://pkgs.tailscale.com/stable/debian/sid.noarmor.gpg"
key_sha256 = "3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39"

[repos.yazi]
uris = "https://yazi-rs.github.io/builds/"
suites = "stable"
components = "main"
key = "https://yazi-rs.github.io/builds/yazi-keyring.gpg"
key_sha256 = "3da842333fc9ec420e404772267a2df4e7fdcee11396820bcf8eae93760d7f26"

# Separate, because both are wanted only by the machine that has the hardware.

[repos.cuda]
separate = true
# debian13, not the debian12 this laptop was configured with: the debian12 key
# A4B469963BF863CC self-certifies with SHA-1, and sequoia's sqv, which apt on
# sid uses, has rejected SHA-1 since 2026-02-01, so that source cannot verify
# at all. The debian13 key 97A5D4CB8793F200 self-certifies with SHA-256.
uris = "https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64/"
suites = "/"
key = "https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64/8793F200.pub"
key_sha256 = "09edb5196bca272c091633d4e04dd6c8f3a07278834868220aa669c895f6cfd7"
description = "apt source for NVIDIA's CUDA repository"

[repos.juno]
separate = true
uris = "https://deb.junocomputers.com/"
suites = "/"
key = "https://deb.junocomputers.com/gpg.key"
key_sha256 = "06347ea57cf8ce6c96cf673f32a34cd6a520c0a0b5aef5db393702072f598901"
description = "apt source for Juno Computers' repository"
