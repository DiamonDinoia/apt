name: validate-precedence

# The distro-precedence suite (test_precedence.sh, D5) against both supported
# baselines. Dispatch for branch sign-off plus a weekly schedule (E23: the
# run pulls the gcc-16 and cross payloads, about 580 MB, and drives eight
# clean containers — cheap enough for a cadence). The scheduled run is the
# only thing that notices the Debian archives drifting under the shipped
# defer pins; per-push would pay that cost for repo changes that cannot
# affect it.

on:
  workflow_dispatch:
    inputs:
      legs:
        description: "suite legs to run (a,b,cfwd,crev)"
        default: "a,b,cfwd,crev"
  schedule:
    # Weekly, offset from the Sunday compiler sweep. Schedules fire on the
    # default branch only, so this entry is inert on team branches.
    - cron: "17 7 * * 3"

permissions:
  contents: read

# Read-only: the suite builds its repository in-runner and fetches stable
# payloads only (never rotated), so unlike validate-compilers it does not
# take the shared `repo` group. A hand dispatch may preempt a scheduled run.
concurrency:
  group: precedence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        baseline: [sid, trixie]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # dpkg-dev + apt-utils for the repo writeout (dpkg-scanpackages,
      # apt-ftparchive); gpg for the throwaway signing key the suite
      # generates in-runner (nothing here touches the production key).
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils gpg

      # GH_TOKEN rides to the mirror-release payload fetches in case the
      # release ever flips visibility or rate-limits anonymous pulls.
      - name: Run the precedence suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./test_precedence.sh --baseline ${{ matrix.baseline }} --legs ${{ github.event.inputs.legs || 'a,b,cfwd,crev' }}
