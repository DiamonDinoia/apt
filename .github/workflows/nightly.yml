name: build

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: repo
  cancel-in-progress: false

env:
  RELEASE_TAG: repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils

      # Holds the few payloads whose publisher offers no checksum, which have to
      # be downloaded once per upstream version to be hashed. Everything else is
      # resolved from a published digest and never downloaded at all.
      - uses: actions/cache@v4
        with:
          path: dl
          key: payloads-${{ github.run_id }}
          restore-keys: payloads-

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')" >> "$GITHUB_ENV"

      # One download from the publisher per new version, ever; users and tests
      # get the payload from the mirror release here. mirror.py rotates new
      # dated trunk nightlies into the release (keep-newest-two, catalog
      # rename schemes), pacing its GitHub calls; --max 4 covers a normal
      # day's rotations.
      - name: Mirror the nightly payloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 mirror.py sync --max 4

      # mirror.py rewrites mirror-manifest.json runner-locally (rotations,
      # prunes) and the runner dies with it; committing it back is what
      # carries the rows to the next run. This push authenticates as
      # GITHUB_TOKEN, and GITHUB_TOKEN pushes do NOT cascade-trigger the
      # push webhook, so this commit cannot re-fire the nightly — that
      # property is load-bearing. mirror-manifest.json is mirror.py's
      # sole-writer domain, so rebasing this manifest-only commit over a
      # concurrent human push cannot conflict.
      - name: Commit mirror manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mirror-manifest.json
          if git diff --cached --quiet; then
            echo "mirror-manifest.json unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "chore: mirror manifest after nightly sync"
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              pushed=true
              break
            fi
            sleep 15
          done
          $pushed

      - name: Build repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 build.py

      - name: Verify the repository is usable
        run: ./test_repo.sh

      # CLion alone unpacks to a few GB inside the container.
      - name: Free runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      # One container per package, so a dependency one package declares cannot
      # stand in for another that forgot to. Peak disk is one package, not all
      # of them, because each container is removed before the next starts.
      - name: Install each package alone in a clean Debian sid container
        run: ./test_install.sh

      - name: Drop payloads for versions no longer referenced
        run: mkdir -p dl && find dl -type f -mtime +30 -delete

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --notes "apt repository. Do not delete."

          have=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          want=$(cd out && ls)

          # Upload only what changed. An asset re-uploaded at the same version
          # with new bytes invalidates every cached index until its next apt
          # update (the deb hashes Packages names no longer match the served
          # bytes), so unchanged assets are left alone; the debs are now
          # byte-stable under SOURCE_DATE_EPOCH. The signed index assets always
          # change; apt refetches them atomically, so that pairing is safe.
          mapfile -t remotes < <(gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[] | .name + " " + .digest')
          for f in out/*; do
            name=${f##*/}
            remote=$(printf '%s\n' ${remotes[@]+"${remotes[@]}"} | awk -v n="$name" '$1 == n {print $2}')
            local_sha="sha256:$(sha256sum "$f" | cut -d' ' -f1)"
            if [[ $remote == "$local_sha" ]]; then
              echo "unchanged $name"
            else
              echo "upload $name"
              gh release upload "$RELEASE_TAG" "$f" --clobber
            fi
          done

          for f in $have; do
            grep -qxF "$f" <<<"$want" ||
              { echo "delete $f"; gh release delete-asset "$RELEASE_TAG" "$f" -y; }
          done

      # Everything above tests out/ on this runner. Only this step fetches the
      # index a user fetches, which is where a name the release host rewrote
      # turns into a 404 that nothing else can see.
      - name: Install from the published repository and check the handover
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./test_gcc17.sh
